name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build installer and run tests
        run: ./packaging/build_installer.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SageChrona-macOS-arm64
          path: release/*.dmg
